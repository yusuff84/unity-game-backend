services:
  db:
    image: postgres:16-alpine
    container_name: unity_game_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-unity_game}
      POSTGRES_USER: ${DB_USER:-unity_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unity_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_HOST:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-unity_user} -d ${DB_NAME:-unity_game}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unity_game_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "${WEB_PORT:-8001}:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
